name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  android-build:
    name: Build Android App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      # 1. Download our repository onto GitHub's temporary computer.
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Android/Gradle needs Java.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Prepare Gradle and cache downloaded dependencies.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. Make sure Linux is allowed to execute the Gradle wrapper.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 5. Compile the app, run unit tests and create the APK.
      - name: Build Android app
        run: ./gradlew build