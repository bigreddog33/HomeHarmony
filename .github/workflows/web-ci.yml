name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web-build:
    name: Build Web App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      # 1. Download the repository onto GitHub's temporary machine.
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # 3. Install exactly the dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 4. Check the code with ESLint.
      - name: Run lint
        run: npm run lint

      # 5. Run the login unit tests.
      - name: Run unit tests
        run: npm test

      # 6. Compile the Next.js application for production.
      - name: Build Next.js app
        run: npm run build
