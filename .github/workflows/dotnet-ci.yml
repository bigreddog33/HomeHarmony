name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore api/Household.slnx

      - name: Build
        run: dotnet build api/Household.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test api/Household.slnx --no-build --configuration Release --verbosity normal